services:
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/data.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # ~100 MB normally; cap so a leak can't starve the rest of the VPS
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
