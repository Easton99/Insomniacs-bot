<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commands — Insomniacs Bot</title>
  <meta name="description" content="Browse and search every Insomniacs Bot command, with syntax, examples and parameters." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
</head>
<body>

<nav class="nav">
  <div class="wrap nav-inner">
    <a class="nav-brand" href="index.html">Insomniacs<span class="dot">.</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="commands.html" class="active">Commands</a>
      <a href="feature-request.html">Requests</a>
    </div>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
  </div>
</nav>

<section class="section cmd-page">
  <div class="wrap">

    <!-- ── List view ───────────────────────────────────── -->
    <div id="cmd-list-view">
      <header class="cmd-header">
        <span class="eyebrow">// reference</span>
        <h1>Insomniacs Bot Commands</h1>
        <p>Browse and search every command. They all live under <code>/ic</code> — type <code>/ic</code> in any channel to get started.</p>
      </header>

      <div class="cmd-layout">
        <aside class="cmd-filters" aria-label="Filters">
          <button type="button" id="facet-popular" class="facet-item facet-popular" aria-pressed="false">
            <span>★ Popular commands</span>
          </button>

          <div class="facet-group">
            <h2 class="facet-title">Categories</h2>
            <div id="facet-category" class="facet-list"></div>
          </div>

          <div class="facet-group">
            <h2 class="facet-title">Who can use it</h2>
            <div id="facet-requires" class="facet-list"></div>
          </div>

          <button type="button" id="cmd-reset" class="cmd-reset">Reset all filters</button>
        </aside>

        <div class="cmd-results">
          <div class="search-bar cmd-search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input id="cmd-search" type="search" placeholder="Search commands… (press /)" autocomplete="off" aria-label="Search commands" />
          </div>

          <div class="cmd-toolbar">
            <span id="cmd-count" class="cmd-count" aria-live="polite"></span>
            <label class="cmd-sort-label">Sort
              <select id="cmd-sort" class="cmd-sort">
                <option value="az">Alphabetical</option>
                <option value="popular">Popular first</option>
                <option value="category">By category</option>
              </select>
            </label>
          </div>

          <div id="cmd-list" class="cmd-list"></div>

          <noscript><p class="cmd-empty">Turn on JavaScript to browse the command list.</p></noscript>
        </div>
      </div>

    </div>

    <!-- ── Detail view (rendered from commands-data.js) ── -->
    <article id="cmd-detail-view" class="cmd-detail" hidden></article>

  </div>
</section>

<footer>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="commands.html">Commands</a>
    <a href="feature-request.html">Requests</a>
    <a href="https://github.com/Easton99/Insomniacs-bot/blob/main/LICENSE" target="_blank" rel="noopener">MIT License</a>
  </div>
  <p>Built for the Insomniacs Discord server.</p>
</footer>

<script src="js/main.js"></script>
<script src="js/commands-data.js"></script>
<script src="js/commands.js"></script>
</body>
</html>
